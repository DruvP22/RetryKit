name: Tests

on: push

jobs:
  test:
    strategy:
      matrix:
        # Windows first since that's what I actually develop on.
        # Ubuntu's here too just to double-check it's not secretly
        # relying on anything Windows-only.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
      - run: swift test